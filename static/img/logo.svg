<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Radar Rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 3" />
  <circle cx="64" cy="64" r="30" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.45" />
  <circle cx="64" cy="64" r="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Orbital Ellipses -->
  <ellipse cx="64" cy="64" rx="46" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-30 64 64)" />
  <ellipse cx="64" cy="64" rx="46" ry="24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(30 64 64)" />

  <!-- Orbital Nodes -->
  <circle cx="64" cy="22" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="64" cy="106" r="3.5" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="22" cy="64" r="3" fill="#38bdf8" />
  <circle cx="106" cy="64" r="3" fill="#10b981" />

  <!-- Center Pulse Waveform (ECG / Uptime Heartbeat) -->
  <path d="M 16 64 L 38 64 L 46 54 L 54 74 L 64 36 L 74 88 L 82 56 L 90 64 L 112 64"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />
</svg>
